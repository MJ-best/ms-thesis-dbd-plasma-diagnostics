<script id="sim">
// Port of examples/vrms_simulation.py (section 10.6): 126 Manley cells driven by E sin(wt) behind R.
const DBD = (() => {
const Z = [0.1257302210933933,-0.1321048632913019,0.6404226504432821,0.10490011715303971,-0.535669373161111,0.36159505490948474,1.3040000451301372,0.9470809631292422,-0.7037352358069926,-1.2654214710460525,-0.6232744625373522,0.0413259793472436,-2.3250307746388343,-0.21879166393254573,-1.2459109472530652,-0.7322673547034516,-0.5442589828573099,-0.31630015636915454,0.4116305363741328,1.0425133694426776,-0.12853466294403426,1.3664634705496859,-0.6651946734866135,0.3515100700930197,0.9034701816518086,0.09401229776087457,-0.7434992493538084,-0.9217253762584194,-0.45772582566733916,0.2201951234700494,-1.009618183538736,-0.20917557487171307,-0.15922500991447772,0.5408455846858077,0.2146591225063409,0.3553727090399214,-0.6538286094183394,-0.12961363369276946,0.7839754700613295,1.4934311452207607,-1.2590655321041202,1.5139237747390626,1.3458754237823045,0.7813114007004275,0.2644556303293035,-0.3139228145364278,1.4580206835369587,1.9602583164499647,1.801634869866125,1.31510376473437,0.357380410658956,-1.2083186322821715,-0.004454133120083229,0.6564749350763358,-1.2883614637495544,0.39512206018200824,0.42986369482223,0.6960427239628685,-1.184117966757189,-0.6617025720390349,-0.43643524714322124,-1.169801907772864,1.739367877130134,-0.4959107284421519,0.3289696294602021,-0.258572545473924,1.5834728788021222,1.3203609870818391,0.6333526228249152,-2.2035098806466507,0.05202897425988651,0.6836861907765345,1.0039615758421696,-0.6179070447076008,1.8220113633283233,-1.3204309700132935,-0.6615280218152191,0.9350499881140221,0.049054613825311656,2.002392583645255,0.18851919251246557,-0.6331940901922267,-0.37756350523280824,-1.0911461176191954,-1.277680166386608,0.6304114907682319,0.5811658124128057,1.294558819441117,-0.7546057912599311,1.689107452443673,-0.2873877078086663,1.5744082788445868,-0.4327858471825968,-0.735483292342275,0.24978537155866684,1.0314530848694723,0.16100957671534466,-0.5855288241233366,-1.341219714076669,-1.401520214917428,0.5026828498748657,0.989713033285805,-0.1642945926252907,-1.0743648582284346,0.8730421526217066,-1.2803939447145731,-0.7130680950592722,0.6210178535400985,-2.2501411735745918,0.38636959756630584,-0.5816408364095031,0.10927969747781388,-0.07570152622082311,0.20211439504395987,0.6941719367070082,-0.7583697508984092,1.4209820223119163,0.726093788947765,0.843732662303268,1.1648639811110282,0.7875882217058694,0.844078680578592,0.07559361074288512,-1.4267738509897323,-0.13504510003701392,-0.7695146401767057];
const ORDER = [2,100,67,19,9,91,41,81,55,3,60,56,83,22,15,105,6,89,78,50,54,49,82,57,1,71,90,119,121,122,25,65,125,0,34,92,40,114,58,68,47,96,120,27,52,61,106,45,39,99,77,31,97,26,32,4,46,17,95,29,79,43,98,42,24,69,86,111,84,107,76,88,38,30,28,87,44,11,108,73,12,35,13,21,113,75,103,70,101,18,59,20,74,66,93,7,115,62,36,72,94,104,23,51,116,123,102,124,80,14,33,48,8,112,85,16,53,5,10,109,118,63,64,37,117,110];
  const N = 126, F0 = 46.8e3;

  function paschen(gamma, pd = 760 * 0.01, A = 15.0, B = 365.0) {
    return B * pd / Math.log(A * pd / Math.log(1 + 1 / gamma));
  }

  // p: Cd, Cg [F], Ub [V], spread, nExposed, gamma, nThinned, theta, nDischarging
  function device(p) {
    const s = p.spread;
    const base = Float64Array.from(Z, z => p.Ub * Math.exp(s * z - s * s / 2));
    const Cd = new Float64Array(N).fill(p.Cd / N), Cg = new Float64Array(N).fill(p.Cg / N);
    const Ub = Float64Array.from(base);
    for (let j = 0; j < (p.nThinned || 0); j++) Cd[ORDER[N - 1 - j]] /= 1 - p.theta;
    const factor = paschen(p.gamma ?? 0.1) / paschen(0.01);
    for (let j = 0; j < (p.nExposed || 0); j++) Ub[ORDER[j]] *= factor;
    const sorted = Array.from(base).sort((a, b) => a - b);
    const med = (sorted[N / 2 - 1] + sorted[N / 2]) / 2;
    const near = Array.from(base.keys()).sort((a, b) => Math.abs(Math.log(base[a] / med)) - Math.abs(Math.log(base[b] / med)));
    const k = p.nDischarging ?? N;
    for (const i of near.slice(k)) Ub[i] = Infinity;  // covered cells: capacitance kept, no discharge
    // cells to trace: the discharging cell nearest the median, and the exposed cell most like it
    const healthy = near.find(i => !ORDER.slice(0, p.nExposed || 0).includes(i));
    const ex = (p.nExposed || 0) > 0 ? ORDER.slice(0, p.nExposed).filter(i => isFinite(Ub[i]))
      .sort((a, b) => Math.abs(Math.log(base[a] / base[healthy])) - Math.abs(Math.log(base[b] / base[healthy])))[0] : undefined;
    return { Cd, Cg, Ub, factor, trace: [healthy, ex].filter(i => i !== undefined) };
  }

  function scaled(dev, x) {
    return { ...dev, Cd: dev.Cd.map(c => c * x), Cg: dev.Cg.map(c => c * x) };
  }

  function run(dev, E, R, f = F0, { settle = 4, periods = 6, dt = 2e-9, trace = [] } = {}) {
    const { Cd, Cg, Ub } = dev;
    const Cc = new Float64Array(N), kf = new Float64Array(N);
    let Cnode = 0;
    for (let i = 0; i < N; i++) { Cc[i] = Cd[i] * Cg[i] / (Cd[i] + Cg[i]); kf[i] = Cc[i] / Cg[i]; Cnode += Cc[i]; }
    const w = 2 * Math.PI * f, n = Math.round((settle + periods) / f / dt), k0 = Math.ceil(settle / f / dt - 1e-9);
    const m = n - k0, V = new Float64Array(m), Q = new Float64Array(m), U = trace.map(() => new Float64Array(m));
    const qc = new Float64Array(N), ug = new Float64Array(N), fire = new Uint8Array(N), b = new Float64Array(N);
    let v = 0;
    for (let k = 0; k < n; k++) {
      v += dt * (E * Math.sin(w * k * dt) - v) / R / Cnode;
      let any = false;
      for (let i = 0; i < N; i++) {
        ug[i] = v - Cc[i] * (v + qc[i] / Cg[i]) / Cd[i];
        fire[i] = Math.abs(ug[i]) > Ub[i];
        any = any || fire[i];
      }
      if (any) {  // hold u_g at +/-U_b,i; the node charge is conserved through the step
        let num = v * Cnode, den = Cnode;
        for (let i = 0; i < N; i++) if (fire[i]) {
          b[i] = -Math.sign(ug[i]) * Ub[i] * Cd[i] * Cg[i] / Cc[i];
          num -= kf[i] * (b[i] - qc[i]);
          den += kf[i] * Cd[i];
        }
        v = num / den;
        for (let i = 0; i < N; i++) if (fire[i]) qc[i] = Cd[i] * v + b[i];
      }
      if (k >= k0) {
        let q = 0;
        for (let i = 0; i < N; i++) q += Cc[i] * v + kf[i] * qc[i];
        V[k - k0] = v; Q[k - k0] = q;
        for (let j = 0; j < trace.length; j++) { const c = trace[j]; U[j][k - k0] = v - Cc[c] * (v + qc[c] / Cg[c]) / Cd[c]; }
      }
    }
    const t = Float64Array.from({ length: m }, (_, j) => j * dt);
    return { t, v: V, Q, U, dt };
  }

  function truth(v, Q) {
    let s = 0, vmax = 0, qmin = Infinity, qmax = -Infinity;
    for (let k = 0; k < v.length; k++) {
      s += v[k] * v[k]; vmax = Math.max(vmax, Math.abs(v[k]));
      qmin = Math.min(qmin, Q[k]); qmax = Math.max(qmax, Q[k]);
    }
    return { v_rms: Math.sqrt(s / v.length), v_max: vmax, q_per_v: (qmax - qmin) / 2 / vmax };
  }

  // features._periods: rising zero crossings after the signal was below -10 % of the amplitude
  function periods(v) {
    let mean = 0, lo = Infinity, hi = -Infinity;
    for (const x of v) { mean += x; }
    mean /= v.length;
    for (const x of v) { lo = Math.min(lo, x - mean); hi = Math.max(hi, x - mean); }
    const h = 0.1 * 0.5 * (hi - lo), zc = [];
    let armed = false;
    for (let k = 0; k < v.length; k++) {
      const x = v[k] - mean;
      if (x < -h) armed = true;
      else if (armed && x >= 0) { zc.push(k); armed = false; }
    }
    return zc.slice(0, -1).map((a, j) => [a, zc[j + 1]]);
  }

  function linfit(x, y) {
    const n = x.length;
    let xm = 0, ym = 0;
    for (let k = 0; k < n; k++) { xm += x[k]; ym += y[k]; }
    xm /= n; ym /= n;
    let sxx = 0, sxy = 0;
    for (let k = 0; k < n; k++) { sxx += (x[k] - xm) ** 2; sxy += (x[k] - xm) * (y[k] - ym); }
    const a = sxy / sxx;
    return { slope: a, intercept: ym - a * xm };
  }

  // lissajous._two_segment: breakpoint of the best two-line fit
  function twoSegment(x, y, minFrac = 0.08) {
    const n = x.length, lo = Math.max(Math.floor(minFrac * n), 3), hi = Math.min(Math.floor((1 - minFrac) * n), n - 3);
    const cums = (xx, yy) => {
      const c = [[], [], [], [], [], []];
      let m = 0, sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0;
      for (let k = 0; k < xx.length; k++) {
        m += 1; sx += xx[k]; sy += yy[k]; sxx += xx[k] * xx[k]; sxy += xx[k] * yy[k]; syy += yy[k] * yy[k];
        c[0].push(m); c[1].push(sx); c[2].push(sy); c[3].push(sxx); c[4].push(sxy); c[5].push(syy);
      }
      return c;
    };
    const sse = (c, k) => {
      const [m, sx, sy, sxx, sxy, syy] = c.map(a => a[k]);
      const vx = sxx - sx * sx / m;
      if (vx <= 0) return Infinity;
      const cxy = sxy - sx * sy / m;
      return syy - sy * sy / m - cxy * cxy / vx;
    };
    const cf = cums(x, y), cb = cums(Array.from(x).reverse(), Array.from(y).reverse());
    let best = Infinity, bk = lo;
    for (let k = lo; k < hi; k++) {
      const s = sse(cf, k - 1) + sse(cb, n - k - 1);
      if (s < best) { best = s; bk = k; }
    }
    return bk;
  }

  function branch(V, Q) {
    const k = twoSegment(V, Q);
    const f1 = linfit(V.slice(0, k), Q.slice(0, k)), f2 = linfit(V.slice(k), Q.slice(k));
    let kp = 0;
    for (let j = 1; j < V.length; j++) if (V[j] > V[kp]) kp = j;
    return { f1, f2, V_on: V[k], Q_on: Q[k], V_peak: V[kp], Q_peak: Q[kp] };
  }

  // lissajous.analyse for one period of centered v and q
  function analyse(v, q) {
    const n = v.length;
    let kmax = 0, kmin = 0;
    for (let k = 1; k < n; k++) { if (v[k] > v[kmax]) kmax = k; if (v[k] < v[kmin]) kmin = k; }
    const idx = (a, b) => { const r = []; for (let k = a; k <= b; k++) r.push(k); return r; };
    let rising, falling;
    if (kmin < kmax) { rising = idx(kmin, kmax); falling = idx(kmax, n - 1).concat(idx(0, kmin)); }
    else { rising = idx(kmin, n - 1).concat(idx(0, kmax)); falling = idx(kmax, kmin); }
    const br = branch(rising.map(k => v[k]), rising.map(k => q[k]));
    const bf = branch(falling.map(k => -v[k]), falling.map(k => -q[k]));
    const Ct = (br.f1.slope + bf.f1.slope) / 2, Cd = (br.f2.slope + bf.f2.slope) / 2;
    let E = 0;
    for (let k = 1; k < n; k++) E += 0.5 * (v[k] + v[k - 1]) * (q[k] - q[k - 1]);
    E += 0.5 * (v[n - 1] + v[0]) * (q[0] - q[n - 1]);
    return {
      c_total: Ct, c_d: Cd, c_g: Cd > Ct ? Cd * Ct / (Cd - Ct) : NaN,
      v_max: (br.V_peak + bf.V_peak) / 2, v_on: (br.V_on + bf.V_on) / 2,
      dq: ((br.Q_peak - br.Q_on) + (bf.Q_peak - bf.Q_on)) / 2, energy: Math.abs(E),
      u_b: ((br.V_on - br.Q_on / br.f2.slope) + (bf.V_on - bf.Q_on / bf.f2.slope)) / 2,
    };
  }

  // per-period Lissajous quantities on the 10 ns record, averaged as features.extract does
  function lissajous(t, v, Q, step = 5) {
    const tt = [], vv = [], qq = [];
    for (let k = 0; k < v.length; k += step) { tt.push(t[k]); vv.push(v[k]); qq.push(Q[k]); }
    const rows = periods(vv).map(([a, b]) => {
      const T = tt[b - 1] - tt[a];
      const pv = vv.slice(a, b), pq = qq.slice(a, b);
      const mv = pv.reduce((s, x) => s + x, 0) / pv.length;
      const cq = (Math.max(...pq) + Math.min(...pq)) / 2;
      const x = pv.map(y => y - mv), y = pq.map(z => z - cq);
      let s2 = 0;
      for (let k = 1; k < x.length; k++) s2 += 0.5 * (x[k] ** 2 + x[k - 1] ** 2) * (tt[a + k] - tt[a + k - 1]);
      return { f: 1 / T, v_rms: Math.sqrt(s2 / T), ...analyse(x, y), _v: x, _q: y };
    });
    const out = {};
    for (const key of Object.keys(rows[0])) if (!key.startsWith("_")) out[key] = rows.reduce((s, r) => s + r[key], 0) / rows.length;
    out.n = rows.length;
    out.loop = { v: rows[rows.length - 1]._v, q: rows[rows.length - 1]._q };
    return out;
  }

  // amplitude of the drive-frequency component over whole periods
  function fundamental(v, f, dt) {
    const m = Math.floor(Math.round(1 / f / dt) * Math.floor(v.length * f * dt));
    let mean = 0;
    for (let k = 0; k < m; k++) mean += v[k];
    mean /= m;
    let re = 0, im = 0;
    const w = 2 * Math.PI * f * dt;
    for (let k = 0; k < m; k++) { re += (v[k] - mean) * Math.cos(w * k); im -= (v[k] - mean) * Math.sin(w * k); }
    return 2 * Math.hypot(re, im) / m;
  }

  // everything the page shows for one parameter set
  function simulate(p) {
    const dev = device(p);
    const r = run(dev, p.E, p.R, p.f, { trace: dev.trace });
    const h = truth(r.v, r.Q);
    const L = lissajous(r.t, r.v, r.Q);
    const e = (() => { const x = run(scaled(dev, 1.03), p.E, p.R, p.f); return truth(x.v, x.Q); })();
    const S = -Math.log(e.v_rms / h.v_rms) / Math.log(e.q_per_v / h.q_per_v);
    const v1 = fundamental(r.v, p.f, r.dt);
    const nFire = Array.from(dev.Ub).filter(isFinite).length;
    return { dev, run: r, truth: h, liss: L, S, v1, nFire, factor: dev.factor };
  }

  return { N, F0, Z, ORDER, paschen, device, run, truth, lissajous, fundamental, simulate, scaled };
})();
if (typeof module !== "undefined") module.exports = DBD;

// compact result for the page: metrics plus decimated curves
function packResult(s, p) {
  const r = s.run, L = s.liss, dt = r.dt;
  const n2 = Math.min(r.v.length, Math.round(2 / p.f / dt));
  const step = Math.max(1, Math.floor(n2 / 900));

    for (let j = 0; j < r.U.length; j++) u[j].push(r.U[j][k]);
  }

  for (let k = 0; k < L.loop.v.length; k += ls) { lv.push(L.loop.v[k]); lq.push(L.loop.q[k] * 1e9); }
  lv.push(lv[0]); lq.push(lq[0]);
  const exposed = new Set(DBD.ORDER.slice(0, p.nExposed || 0));
  return {
    m: {
      v_rms: s.truth.v_rms, v_1: s.v1, v_max: s.truth.v_max, qpv: L.dq / L.v_max, von: L.v_on / L.v_max, u_b: L.u_b,
      c_total: L.c_total, c_d: L.c_d, dq: L.dq, energy: L.energy, power: L.energy * p.f, S: s.S, nFire: s.nFire,
    },
    flat: !(L.c_d > 1.25 * L.c_total), factor: s.factor,
    t, v, u, traceUb: s.dev.trace.map(i => s.dev.Ub[i]), traceExposed: s.dev.trace.map(i => exposed.has(i)), lv, lq,
  };
}

    try { self.postMessage({ kind, r: packResult(DBD.simulate(p), p) }); }
    catch (err) { self.postMessage({ kind, error: String(err) }); }
  };
}

      meas: { v_rms: "−2.85 / −2.31 %", qpv: "+6.56 / +5.08 %", von: "−33.3 / −31.0 %", u_b: "−13.6 / −1.3 %", c_total: "+2.36 / −1.37 %", c_d: "−4.05 / +2.55 %", energy: "−15.6 / +7.45 %" } },
  ];

  const paschen = DBD.paschen;
  const lin = (min, max, step, k = 1) => ({ toPos: x => x * k, fromPos: x => x / k, min, max, step });
  const log = (min, max) => ({ toPos: x => 1000 * Math.log(x / min) / Math.log(max / min), fromPos: p => min * (max / min) ** (p / 1000), min: 0, max: 1000, step: 1 });
  const cnt = x => `${x}${t().count}`;
  const CTL = {
    E: { ...lin(1000, 8000, 1), fmt: x => `${x.toFixed(0)} V` },
    R: { ...log(1e4, 1e6), fmt: x => `${(x / 1e3).toFixed(x < 1e5 ? 1 : 0)} kΩ` },
    f: { ...lin(20000, 100000, 10), fmt: x => `${(x / 1e3).toFixed(2)} kHz` },
    Cd: { ...lin(10, 100, 0.1, 1e12), fmt: x => `${(x * 1e12).toFixed(1)} pF` },
    Cg: { ...lin(5, 50, 0.1, 1e12), fmt: x => `${(x * 1e12).toFixed(1)} pF` },
    Ub: { ...lin(400, 1500, 0.1), fmt: x => `${x.toFixed(1)} V` },
    spread: { ...lin(0, 0.4, 0.001), fmt: x => x.toFixed(3) },
    nExposed: { ...lin(0, 126, 1), fmt: x => `${cnt(x)} (${Math.round(100 * x / 126)} %)` },
    gamma: { ...log(0.01, 0.5), fmt: x => x.toFixed(3), sub: x => t().gammaSub((paschen(x) / paschen(0.01)).toFixed(3)) },
    nThinned: { ...lin(0, 126, 1), fmt: cnt },
    theta: { ...lin(0, 0.8, 0.01), fmt: x => `${Math.round(100 * x)} %`, sub: x => `C_d,i × ${(1 / (1 - x)).toFixed(2)}` },
    nDischarging: { ...lin(1, 126, 1), fmt: cnt, sub: () => t().coverSub },
  };
  const INT = new Set(["nExposed", "nThinned", "nDischarging"]);

  const state = { ref: { ...HEALTHY }, cur: { ...HEALTHY }, preset: null, modified: false, res: { ref: null, cur: null }, busy: true, error: "" };

  // ---------- controls ----------
  const inputs = {};
  for (const el of document.querySelectorAll(".ctl")) {
    const key = el.dataset.key, c = CTL[key];
    el.innerHTML = `<div class="row"><label for="in-${key}" id="lab-${key}"></label><output id="out-${key}" for="in-${key}"></output></div>
      <input type="range" id="in-${key}" min="${c.min}" max="${c.max}" step="${c.step}">${c.sub ? `<small id="sub-${key}"></small>` : ""}`;
    const input = el.querySelector("input");
    inputs[key] = input;
    input.addEventListener("input", () => {
      let x = c.fromPos(+input.value);
      if (INT.has(key)) x = Math.round(x);
      state.cur[key] = x;
      state.modified = true;
      showValue(key);
      renderNote();
      request("cur");
    });
  }
  function showValue(key) {
    const c = CTL[key], x = state.cur[key];
    document.getElementById(`lab-${key}`).textContent = t().ctl[key];
    document.getElementById(`out-${key}`).textContent = c.fmt(x);
    if (c.sub) document.getElementById(`sub-${key}`).textContent = c.sub(x);
  }
  function syncInputs() {
    for (const key in inputs) { inputs[key].value = CTL[key].toPos(state.cur[key]); showValue(key); }
  }

  // ---------- presets ----------
  const presetBox = document.getElementById("presets");
  for (const p of PRESETS) {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.id = p.id;
    b.addEventListener("click", () => applyPreset(p.id));
    presetBox.append(b);
  }
  function applyPreset(id) {
    const p = PRESETS.find(x => x.id === id);
    state.preset = p; state.modified = false;
    state.ref = { ...p.ref }; state.cur = { ...p.cur };
    syncInputs(); renderNote();
    request("ref"); request("cur");
  }
  function renderNote() {
    for (const b of presetBox.children) {
      b.textContent = t().p[b.dataset.id][0];
      b.setAttribute("aria-pressed", String(!!state.preset && b.dataset.id === state.preset.id && !state.modified));
    }
    const n = document.getElementById("presetNote");
    if (!state.preset) n.innerHTML = t().custom;
    else n.innerHTML = t().p[state.preset.id][1] + (state.modified ? t().modified : "");
  }
  document.getElementById("pin").addEventListener("click", () => {
    state.ref = { ...state.cur }; state.preset = null; state.modified = false;
    state.res.ref = state.res.cur; renderNote(); render();
  });
  document.getElementById("reset").addEventListener("click", () => applyPreset("healthy"));

  // ---------- computation (worker, with a main-thread fallback) ----------
  let worker = null, busy = false, current = null;
  const pending = { ref: null, cur: null };
  try {
    const src = document.getElementById("sim").textContent;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    worker.onmessage = e => done(e.data.kind, e.data.r, e.data.error);
    worker.onerror = () => {  // e.g. workers refused for file:// pages: compute on the page instead
      worker = null; busy = false;
      if (current) pending[current.kind] = pending[current.kind] || current.p;
      pump();
    };
  } catch (_) { worker = null; }
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  function request(kind) { pending[kind] = { ...state[kind] }; pump(); }
  function showStatus() {
    const s = document.getElementById("status");
    s.textContent = state.error ? t().failed + state.error : state.busy ? t().busy : t().ready;
    s.dataset.busy = String(state.busy);
  }
  function pump() {
    if (busy) return;
    const kind = pending.ref ? "ref" : pending.cur ? "cur" : null;
    state.busy = !!kind; showStatus();
    if (!kind) return;
    const p = pending[kind]; pending[kind] = null;
    busy = true; current = { kind, p };
    if (worker) worker.postMessage(current);
    else setTimeout(() => { try { done(kind, packResult(DBD.simulate(p), p)); } catch (err) { done(kind, null, String(err)); } }, 0);
  }
  function done(kind, r, error) {
    busy = false;
    state.error = error || "";
    if (!error) {
      state.res[kind] = r;
      const other = kind === "ref" ? "cur" : "ref";  // the same parameters on both sides: reuse the result
      if (pending[other] && same(pending[other], current.p)) { state.res[other] = r; pending[other] = null; }
      render();
    }
    pump();
  }

  // ---------- table ----------
  const ROWS = [
    { k: "v_rms", unit: "V", d: 0 }, { k: "v_1", unit: "V", d: 0 }, { k: "v_max", unit: "V", d: 0 },
    { k: "qpv", unit: "pF", s: 1e12, d: 1, liss: true }, { k: "von", unit: "", d: 3, liss: true }, { k: "u_b", unit: "V", d: 0, liss: true },
    { k: "c_total", unit: "pF", s: 1e12, d: 2 }, { k: "c_d", unit: "pF", s: 1e12, d: 1, liss: true }, { k: "dq", unit: "nC", s: 1e9, d: 1, liss: true },
    { k: "energy", unit: "µJ", s: 1e6, d: 1 }, { k: "power", unit: "W", d: 2 }, { k: "S", unit: "", d: 2 }, { k: "nFire", unit: "count", d: 0 },
  ];
  const minus = s => s.replace(/^-/, "−");
  const fmtNum = (x, row) => Number.isFinite(x) ? minus((x * (row.s || 1)).toLocaleString("en-US", { minimumFractionDigits: row.d, maximumFractionDigits: row.d })) : "–";
  function renderTable() {
    const { ref, cur } = state.res, tx = t();
    const table = document.getElementById("table");
    const meas = state.preset && state.preset.meas;
    table.className = state.modified ? "stale" : "";
    let html = `<thead><tr>${tx.th.map(h => `<th>${h}</th>`).join("")}${meas ? `<th class="meas">${tx.p[state.preset.id][2]}</th>` : ""}</tr></thead><tbody>`;
    for (const row of ROWS) {
      const a = ref && ref.m[row.k], b = cur && cur.m[row.k];
      const da = ref && ref.flat && row.liss, db = cur && cur.flat && row.liss;
      const unit = row.unit === "count" ? tx.count : row.unit;
      const cell = (x, dag) => x === undefined || x === null ? "–" : `${dag ? "(" : ""}${fmtNum(x, row)}${dag ? ")" : ""}${unit ? `<span class="unit">${unit}</span>` : ""}${dag ? '<span class="dagger">†</span>' : ""}`;
      let chg = "–";
      if (Number.isFinite(a) && Number.isFinite(b) && a !== 0 && !da && !db) {
        const c = 100 * (b / a - 1);
        chg = Math.abs(c) < 0.05 ? "0.0 %" : `${c > 0 ? "+" : "−"}${Math.abs(c).toFixed(1)} %`;
      }
      html += `<tr><td>${tx.rows[row.k]}</td><td class="num">${cell(a, da)}</td><td class="num">${cell(b, db)}</td><td class="chg">${chg}</td>${meas ? `<td class="meas">${meas[row.k] || ""}</td>` : ""}</tr>`;
    }
    table.innerHTML = html + "</tbody>";
    const flat = (ref && ref.flat) || (cur && cur.flat);
    document.getElementById("tableFoot").textContent = (flat ? tx.flatFoot : "") + tx.foot;
  }

  // ---------- charts ----------
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  function niceTicks(lo, hi, n = 5) {
    const span = hi - lo || 1, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;
    const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag, out = [];
    for (let x = Math.ceil(lo / step) * step; x <= hi + step * 1e-9; x += step) out.push(Math.abs(x) < step * 1e-9 ? 0 : x);
    return out;
  }
  const fmtTick = x => minus(x.toLocaleString("en-US", { maximumFractionDigits: 3 }));

  function makeChart(id, opts) {
    const box = document.getElementById(id), cv = document.createElement("canvas"), tip = document.createElement("div");
    tip.className = "tip"; tip.hidden = true;
    box.append(cv, tip);
    const ch = { series: [], hlines: [], hover: null, frame: null };
    const M = { l: 54, r: 12, t: 10, b: 34 };
    function draw() {
      const dpr = window.devicePixelRatio || 1, W = box.clientWidth, H = box.clientHeight;
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
      const g = cv.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      const all = ch.series.filter(s => s.x.length);
      if (!all.length) { g.fillStyle = css("--muted"); g.font = `13px ${css("--font-sans")}`; g.fillText(t().busy, M.l, H / 2); return; }
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const s of all) for (let k = 0; k < s.x.length; k++) {
        x0 = Math.min(x0, s.x[k]); x1 = Math.max(x1, s.x[k]); y0 = Math.min(y0, s.y[k]); y1 = Math.max(y1, s.y[k]);
      }
      for (const h of ch.hlines) if (Number.isFinite(h.y)) { y0 = Math.min(y0, h.y); y1 = Math.max(y1, h.y); }
      if (opts.xPad) { const p = (x1 - x0) * opts.xPad; x0 -= p; x1 += p; }
      const py = (y1 - y0) * 0.06 || 1; y0 -= py; y1 += py;
      const pw = W - M.l - M.r, ph = H - M.t - M.b;
      const X = x => M.l + (x - x0) / (x1 - x0) * pw, Y = y => M.t + (1 - (y - y0) / (y1 - y0)) * ph;
      ch.frame = { X, Y, x0, x1, y0, y1, M, pw, ph };
      g.font = `11px ${css("--font-mono")}`; g.lineWidth = 1; g.fillStyle = css("--muted");
      g.textAlign = "right"; g.textBaseline = "middle";
      for (const y of niceTicks(y0, y1, Math.max(3, Math.round(ph / 50)))) {
        g.beginPath(); g.moveTo(M.l, Math.round(Y(y)) + 0.5); g.lineTo(W - M.r, Math.round(Y(y)) + 0.5);
        g.strokeStyle = y === 0 ? css("--line") : css("--grid"); g.stroke();
        g.fillText(fmtTick(y), M.l - 6, Y(y));
      }
      g.textAlign = "center"; g.textBaseline = "top";
      for (const x of niceTicks(x0, x1, Math.max(3, Math.round(pw / 80)))) {
        g.beginPath(); g.moveTo(Math.round(X(x)) + 0.5, M.t); g.lineTo(Math.round(X(x)) + 0.5, M.t + ph);
        g.strokeStyle = x === 0 && opts.xZero ? css("--line") : css("--grid"); g.stroke();
        g.fillText(fmtTick(x), X(x), M.t + ph + 6);
      }
      g.textAlign = "right"; g.font = `11px ${css("--font-sans")}`;
      g.fillText(typeof opts.xlabel === "function" ? opts.xlabel() : opts.xlabel, W - M.r, M.t + ph + 20);
      for (const h of ch.hlines) {
        if (!Number.isFinite(h.y)) continue;
        g.save(); g.setLineDash([2, 3]); g.strokeStyle = css(h.color); g.globalAlpha = 0.8;
        g.beginPath(); g.moveTo(M.l, Y(h.y)); g.lineTo(W - M.r, Y(h.y)); g.stroke(); g.restore();
      }
      g.save(); g.beginPath(); g.rect(M.l, M.t, pw, ph); g.clip();
      for (const s of all) {
        g.setLineDash(s.dash ? [6, 4] : []); g.lineWidth = s.width || 2; g.strokeStyle = css(s.color); g.lineJoin = "round";
        g.beginPath();
        for (let k = 0; k < s.x.length; k++) k ? g.lineTo(X(s.x[k]), Y(s.y[k])) : g.moveTo(X(s.x[k]), Y(s.y[k]));
        g.stroke();
      }
      g.restore(); g.setLineDash([]);
      if (ch.hover) {
        const hv = ch.hover;
        g.strokeStyle = css("--muted"); g.lineWidth = 1;
        if (opts.mode === "time") { g.beginPath(); g.moveTo(X(hv.x) + 0.5, M.t); g.lineTo(X(hv.x) + 0.5, M.t + ph); g.stroke(); }
        for (const pt of hv.points) {
          g.beginPath(); g.arc(X(pt.x), Y(pt.y), 4, 0, 2 * Math.PI);
          g.fillStyle = css(pt.s.color); g.fill(); g.lineWidth = 2; g.strokeStyle = css("--panel"); g.stroke();
        }
      }
    }
    function nearestIndex(arr, x) {
      let lo = 0, hi = arr.length - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (arr[mid] < x) lo = mid; else hi = mid; }
      return Math.abs(arr[lo] - x) < Math.abs(arr[hi] - x) ? lo : hi;
    }
    function onMove(ev) {
      const f = ch.frame; if (!f) return;
      const rect = cv.getBoundingClientRect(), mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
      if (mx < f.M.l || mx > f.M.l + f.pw || my < f.M.t || my > f.M.t + f.ph) { leave(); return; }
      const all = ch.series.filter(s => s.x.length && s.label);
      let points = [], x = null;
      if (opts.mode === "time") {
        x = f.x0 + (mx - f.M.l) / f.pw * (f.x1 - f.x0);
        points = all.map(s => { const k = nearestIndex(s.x, x); return { s, x: s.x[k], y: s.y[k] }; });
      } else {
        let best = null, bd = Infinity;
        for (const s of all) for (let k = 0; k < s.x.length; k++) {
          const d = (f.X(s.x[k]) - mx) ** 2 + (f.Y(s.y[k]) - my) ** 2;
          if (d < bd) { bd = d; best = { s, x: s.x[k], y: s.y[k] }; }
        }
        if (!best || bd > 40 * 40) { leave(); return; }
        points = [best];
      }
      ch.hover = { x, points };
      draw();
      tip.hidden = false;
      tip.innerHTML = opts.tip(x, points);
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let tx = mx + 14, ty = my - th - 10;
      if (tx + tw > box.clientWidth) tx = mx - tw - 14;
      if (ty < 0) ty = my + 14;
      tip.style.left = `${Math.max(0, tx)}px`; tip.style.top = `${ty}px`;
    }
    function leave() { if (ch.hover) { ch.hover = null; draw(); } tip.hidden = true; }
    cv.addEventListener("pointermove", onMove);
    cv.addEventListener("pointerdown", onMove);
    cv.addEventListener("pointerleave", leave);
    new ResizeObserver(() => draw()).observe(box);
    ch.draw = draw;
    return ch;
  }

  const sw = color => `<i style="background:${css(color)}"></i>`;
  const V = x => `${minus(Math.round(x).toLocaleString("en-US"))} V`;
  const timeTip = (x, pts) => `t = ${x.toFixed(2)} µs<br>` + pts.map(p => `${sw(p.s.color)}${p.s.label()} ${V(p.y)}`).join("<br>");
  const charts = {
    v: makeChart("p-v", { mode: "time", xlabel: () => t().time, tip: timeTip }),
    g: makeChart("p-g", { mode: "time", xlabel: () => t().time, tip: timeTip }),
    liss: makeChart("p-liss", { mode: "xy", xlabel: "V [V]", xPad: 0.02, xZero: true,
      tip: (_, pts) => pts.map(p => `${sw(p.s.color)}${p.s.label()}<br>V ${V(p.x)}<br>Q ${minus(p.y.toFixed(1))} nC`).join("") }),
  };
  const legend = (id, items) => {
    document.getElementById(id).innerHTML = items.map(([color, cls, label]) => `<span><span class="sw ${cls}" style="border-color:var(${color})"></span>${label}</span>`).join("");
  };

  function renderCharts() {
    const { ref, cur } = state.res, tx = t();
    const pair = (ch, key) => {
      ch.series = [];
      if (ref) ch.series.push({ x: ref[key[0]], y: ref[key[1]], color: "--ref", width: 1.5, dash: true, label: () => t().ref });
      if (cur) ch.series.push({ x: cur[key[0]], y: cur[key[1]], color: "--accent", width: 2, label: () => t().cur });
      ch.draw();
    };
    pair(charts.v, ["t", "v"]);
    pair(charts.liss, ["lv", "lq"]);
    legend("lg-v", [["--ref", "dash", tx.ref], ["--accent", "", tx.cur]]);
    legend("lg-liss", [["--ref", "dash", tx.ref], ["--accent", "", tx.cur]]);
    charts.g.series = []; charts.g.hlines = [];
    const items = [];
    if (cur) cur.u.forEach((u, j) => {
      const exposed = cur.traceExposed[j], color = exposed ? "--damage" : "--accent";
      const label = () => exposed ? t().exposedCell : t().healthyCell;
      charts.g.series.push({ x: cur.t, y: u, color, width: 2, label });
      charts.g.hlines.push({ y: cur.traceUb[j], color }, { y: -cur.traceUb[j], color });
      items.push([color, "", label() + (Number.isFinite(cur.traceUb[j]) ? ` (U_b,i ${Math.round(cur.traceUb[j])} V)` : "")]);
    });
    items.push(["--muted", "dot", "±U_b,i"]);
    charts.g.draw();
    legend("lg-g", items);
  }

  function render() { renderTable(); renderCharts(); showStatus(); }

  const redraw = () => Object.values(charts).forEach(c => c.draw());
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });

  // ---------- schematic ----------
  function schematic() {
    const s = document.getElementById("schematic"), tx = t().svg;
    s.setAttribute("aria-label", tx.label);
    const ink = "var(--ink-2)", dmg = "var(--damage)", txt = "var(--ink-2)";
    const L = (x1, y1, x2, y2, c = ink, w = 1.4) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${c};stroke-width:${w};stroke-linecap:round"/>`;
    const Tx = (x, y, s, a = "middle", c = txt, size = 11) => `<text x="${x}" y="${y}" text-anchor="${a}" style="font-size:${size}px;fill:${c};font-family:var(--font-mono)">${s}</text>`;
    const cap = (x, y, c) => L(x, y - 14, x, y - 3, c) + L(x - 10, y - 3, x + 10, y - 3, c, 2) + L(x - 10, y + 3, x + 10, y + 3, c, 2) + L(x, y + 3, x, y + 14, c);
    const cell = (x, c, tag) => L(x, 50, x, 66, c) + cap(x, 80, c) + L(x, 94, x, 108, c) + L(x - 16, 108, x + 16, 108, c)
      + L(x - 16, 108, x - 16, 118, c) + cap(x - 16, 132, c) + L(x - 16, 146, x - 16, 158, c)
      + L(x + 16, 108, x + 16, 120, c) + `<rect x="${x + 5}" y="120" width="22" height="24" rx="3" style="fill:var(--panel);stroke:${c};stroke-width:1.4"/>`
      + Tx(x + 16, 136, "±", "middle", c, 12) + L(x + 16, 144, x + 16, 158, c) + L(x - 16, 158, x + 16, 158, c) + L(x, 158, x, 190, c)
      + Tx(x, 212, tag, "middle", c, 10.5);
    const zig = Array.from({ length: 9 }, (_, j) => `${118 + j * 9},${j === 0 || j === 8 ? 50 : 50 + (j % 2 ? -7 : 7)}`).join(" ");
    s.innerHTML = `<rect x="14" y="20" width="200" height="200" rx="8" style="fill:var(--panel-2);stroke:var(--line)"/>`
      + Tx(114, 36, tx.supply)
      + `<circle cx="58" cy="120" r="20" style="fill:var(--panel);stroke:${ink};stroke-width:1.4"/>` + Tx(58, 125, "~", "middle", ink, 18)
      + Tx(58, 160, "E sin ωt") + L(58, 100, 58, 50) + L(58, 50, 118, 50)
      + `<polyline points="${zig}" style="fill:none;stroke:${ink};stroke-width:1.4;stroke-linejoin:round"/>` + Tx(154, 74, "R")
      + L(190, 50, 600, 50) + L(58, 140, 58, 190) + L(58, 190, 600, 190)
      + `<circle cx="244" cy="50" r="3" style="fill:${ink}"/><circle cx="244" cy="190" r="3" style="fill:${ink}"/>` + L(244, 62, 244, 178, "var(--line)", 1)
