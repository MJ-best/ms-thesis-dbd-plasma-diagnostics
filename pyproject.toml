[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dbd-diagnostics"
version = "1.0.0"
description = "Electrical diagnostics (V-I, Lissajous, equivalent circuit) and ML surface-damage prediction for atmospheric-pressure DBD plasma"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Minjun Kim"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.9", "pandas>=1.5", "scikit-learn>=1.2"]

[project.urls]
Repository = "https://github.com/MJ-best/ms-thesis-dbd-plasma-diagnostics"
Thesis = "https://www.dbpia.co.kr/journal/detail?nodeId=T16940279"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.scripts]
dbd-diag = "dbd_diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbd_diagnostics = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
